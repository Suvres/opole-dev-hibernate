services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
  postgres:
    container_name: bib_post
    image: 'postgres:latest'
    shm_size: 512m
    environment:
      - 'POSTGRES_DB=root'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
      - 'POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=pl_PL.UTF-8 --lc-ctype=pl_PL.UTF-8"'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=512MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: