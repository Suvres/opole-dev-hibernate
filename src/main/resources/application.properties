# ============================================================================
# DATASOURCE & POSTGRESQL (zgodne z docker-compose: root / root / biblioteka_db)
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/root
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Pula połączeń HikariCP (dobra pod testy i duże wolumeny)
spring.datasource.hikari.pool-name=BibliotekaHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================================
# HIBERNATE / JPA (schemat inicjalizowany przez init.sql w Dockerze)
# ============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================================
# OPENTELEMETRY (logi, ślady i metryki -> np. grafana/otel-lgtm na :4318)
# ============================================================================
spring.application.name=biblioteka-api
management.opentelemetry.resource-attributes.service.name=biblioteka-api
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics